name: Check
on: [push]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify
      - run: node --check src/main/resources/static/app.js
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          css = Path('src/main/resources/static/styles.css').read_text()
          html = Path('src/main/resources/static/index.html').read_text()
          js = Path('src/main/resources/static/app.js').read_text()
          assert css.count('{') == css.count('}')
          assert all(f'data-nav="{key}"' in html for key in ('home', 'students', 'teachers', 'courses'))
          assert 'id="content"' in html and 'id="breadcrumb"' in html
          assert 'menuButton' not in js
          assert '<!--' not in html and '/*' not in css
          PY
